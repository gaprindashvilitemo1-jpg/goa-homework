<!--1. ჩემი პირველი ვებგვერდი

შექმენი HTML გვერდი თემაზე „ჩემ შესახებ“.

გამოიყენე:

- <h1> — მთავარი სათაური
- <h2> — ქვესათაური
- <p> — მინიმუმ 3 აბზაცი
- <strong> და <b> — მნიშვნელოვანი სიტყვების გამოსაყოფად
- <em> და <i> — ტექსტის დასახრელად
- <hr> — სექციების გასაყოფად

გვერდზე დაწერე:
- შენი სახელი
- შენი ასაკი
- შენი ჰობი
- რატომ მოგწონს პროგრამირება-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ჩემ შესახებ</h1>
    <h2>მე ვარ 16 წლის და მქვია თემო</h2>
    <p>ვარ დაკავებული <strong>ჯანსაღი</strong>ცხოვრებით, და ასევე ვსწავლობ <b>პროგრამირებას</b></p>
    <p><em>მიყვარს თევზაობა და ასევე ნადირობა</em><i>ასევე მიყვარს ცურვა და მთაზე ცოცაობა</i></p>
    <hr>
    <ul>
        <li>სახელი - თემო</li>
        <li>ასაკი - 16</li>
        <li>ჰობი - ვარჯიში</li>
        <li>პროგრამირება - ძალიან საინტერესოა</li>
    </ul>
</body>
</html>
