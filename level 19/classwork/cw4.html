<!--4) შექმენი „ჩემი ვიდეოების გვერდი“.
გამოიყენე <h1>, <h2>, <p>, <video> და <hr>.
დაამატე მინიმუმ 2 ვიდეო და გამოიყენე controls, width, loop, muted და poster.
თითოეულ ვიდეოს ქვემოთ დაწერე მოკლე აღწერა.-->


<!DOCTYPE html>
<html>
<head>
    <title>ჩემი ვიდეოების გვერდი</title>
</head>
<body>

    <h1>ჩემი ვიდეოების გვერდი</h1>

    <h2>ჩემი პირველი ვიდეო</h2>

    <video src="Ken Carson - ss (Official Audio).mp4" controls width="500" loop muted poster="Ken Carson - ss (Official Audio).mp4"></video>

    <p>ეს არის ჩემი პირველი საყვარელი ვიდეო. მას თავისუფალ დროს ვუყურებ.</p>

    <hr>

    <h2>ჩემი მეორე ვიდეო</h2>

    <video controls width="500" loop muted poster="Ken Carson - ss (Official Audio).mp4">
        <source src="Ken Carson - ss (Official Audio).mp4" type="video/mp4">
    </video>

    <p>ეს არის ჩემი მეორე ვიდეო, რომელიც ძალიან მომწონს და ხშირად ვუყურებ.</p>

    <hr>

</body>
</html>
