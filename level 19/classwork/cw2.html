<!--2) შექმენი „ჩემი საყვარელი ნივთების“ გვერდი.
გამოიყენე <h1>, <h2>, <img>, <ul>, <li> და <a>.
დაამატე მინიმუმ 3 სურათი, თითოეულს მიუთითე alt და width.
ასევე დაამატე მინიმუმ 2 ბმული.-->


<!DOCTYPE html>
<html>
<head>
    <title>ჩემი საყვარელი ნივთები</title>
</head>
<body>

    <h1>ჩემი საყვარელი ნივთები</h1>

    <h2>ჩემი ნივთების სია</h2>

    <ul>
        <li>კომპიუტერი</li>
        <li>ტელეფონი</li>
        <li>ყურსასმენები</li>
    </ul>

    <h2>კომპიუტერი</h2>
    <img src="https://images.unsplash.com/photo-1593640408182-31c70c8268f5" alt="კომპიუტერი" width="300">

    <h2>ტელეფონი</h2>
    <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" alt="ტელეფონი" width="300">

    <h2>ყურსასმენები</h2>
    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e" alt="ყურსასმენები" width="300">

    <h2>სასარგებლო ბმულები</h2>

    <ul>
        <li><a href="https://www.google.com">Google</a></li>
        <li><a href="https://www.youtube.com">YouTube</a></li>
    </ul>

</body>
</html>
