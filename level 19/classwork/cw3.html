<!--3) შექმენი „ჩემი მუსიკალური კუთხე“.
გამოიყენე <h1>, <p>, <audio>, <ul>, <li>, <strong> და <i>.
დაამატე აუდიო ფაილი controls-ით და ჩამოწერე მინიმუმ 5 საყვარელი სიმღერა.-->

<!DOCTYPE html>
<html>
<head>
    <title>ჩემი მუსიკალური კუთხე</title>
</head>
<body>

    <h1>ჩემი მუსიკალური კუთხე</h1>

    <p>
        <strong>მუსიკა</strong> ჩემი დღის მნიშვნელოვანი ნაწილია.
        განსაკუთრებით მომწონს <i>Ken Carson, Playboi Carti და Yeat</i>.
    </p>

    <h2>ჩემი საყვარელი სიმღერები</h2>

    <ul>
        <li>Ken Carson - Yale</li>
        <li>Ken Carson - Fighting My Demons</li>
        <li>Playboi Carti - Sky</li>
        <li>Playboi Carti - R.I.P.</li>
        <li>Yeat - Money So Big</li>
    </ul>

    <h2>ჩემი მუსიკა</h2>

    <audio controls>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

</body>
</html>
