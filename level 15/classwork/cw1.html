<!--შექმენი HTML გვერდი შენს შესახებ. გამოიყენე <h1>, <h2> და <p>. დაწერე შენი სახელი, ასაკი, ჰობი და საყვარელი სპორტი.-->

    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <h1>ჩემი სახელია თემო, ვარ 16 წლის</h1>
        <h2>ჩემი საყვარელი ჰობია ვარჯიში</h2>
        <p>საყვარელი სპორტი კი ბოქსი</p>
    </body>
    </html>
