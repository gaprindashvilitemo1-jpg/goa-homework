<!--5„„. Registration Form
შექმენი Registration Form
First Name
Last Name
Email
Password
Register ღილაკი1. მარტივი ფორმა
შექმენი <form>, რომელშიც იქნება:
label — Name
input — სახელის შესაყვანად
button — Submit-->

<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

    <form>
        <label>First Name</label>
        <input type="text">
        <br><br>
        <label>Last Name</label>
        <input type="text">
        <br><br>
        <label>Email</label>
        <input type="email">
        <br><br>
        <label>Password</label>
        <input type="password">
        <br><br>
        <button>Register</button>
    </form>

</body>
</html>
