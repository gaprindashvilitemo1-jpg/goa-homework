<!--9. Search Form

შექმენი <form>, რომელშიც იქნება:

label — Search
input — საძიებო ტექსტის შესაყვანად
button — Search

Input-ს დაუმატე placeholder: Search...-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="">Search: </label>
        <input type="text" placeholder="Search...">
        <button>Search</button>


    </form>
</body>
</html>
