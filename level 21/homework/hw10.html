<!--10. სრული Registration Form

შექმენი <form>, რომელშიც იქნება:

label — First Name
input — სახელის შესაყვანად

label — Last Name
input — გვარის შესაყვანად

label — Email
input — Email-ის შესაყვანად

label — Password
input — პაროლის შესაყვანად

button — Register

ყველა input-ს უნდა ჰქონდეს შესაბამისი type.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="">First name</label>
        <input type="text">

        <label for="">Last name</label>
        <input type="text">

        <label for="">Email</label>
        <input type="email">

        <label for="">Password</label>
        <input type="password">
        
        <button>Register</button>

    </form>
</body>
</html>
