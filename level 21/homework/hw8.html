<!--8. User Information Form

შექმენი <form>, რომელშიც იქნება:

label — Name
input — სახელის შესაყვანად

label — Age
input — ასაკის შესაყვანად

label — City
input — ქალაქის შესაყვანად

button — Submit-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="">enter youre name: </label>
        <input type="text">

        <label for="">enter youre age: </label>
        <input type="number">

        <label for="">enter youre city: </label>
        <input type="text">
        <button>Submit</button>

    </form>
</body>
</html>
