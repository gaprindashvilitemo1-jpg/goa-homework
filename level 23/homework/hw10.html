<!--10. შექმენი მარტივი რეგისტრაციის ფორმა

შექმენი HTML ფაილი და დაამატე <form>.

ფორმაში დაამატე:

- label — Username
- <input> — მომხმარებლის სახელის შესაყვანად.
- label — Age
- <input> — ასაკის შესაყვანად.
- <select> — ქვეყნის ასარჩევად.
- 5 <option> — Georgia, France, Germany, Italy, Spain.
- button — Submit. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="Register">
        <label for="text">enter youre name:</label>
        <input type="text" placeholder="Enter youre name">
    <br>
        <label for="age">enter youre age: </label>
        <input type="number" placeholder="Enter youre age">
    <br>
        <select name="" id="country">
            <option value="Georgia">Georgia</option>
            <option value="France">France</option>
            <option value="Germany">Germany</option>
            <option value="Italy">Italy</option>
            <option value="Spain">Spain</option>
        </select>
        <button>Submit</button>
    </form>
</body>
</html>
