<!--2. აირჩიე საყვარელი ცხოველი

შექმენი HTML ფაილი და დაამატე ჩამოსაშლელი მენიუ.

დაამატე შემდეგი <option>-ები:

- Dog
- Cat
- Lion
- Tiger
- Rabbit

მომხმარებელს უნდა შეეძლოს საყვარელი ცხოველის არჩევა.  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fav dog breed</title>
</head>
<body>
    <form action="Register">
    <label for="text">enter youre fav animal: </label>
        <select name="" id="Dog">Dog breed
            <option value="Dog">Dog</option>  
            <option value="Cat">Cat</option>
            <option value="Lion">Lion</option>
            <option value="Tiger">Tiger</option>
            <option value="Rabbit">Rabbit</option>
        </select>
        <button>Submit</button>

    </form>
</body>
</html>
