<!--3. აირჩიე კვირის დღე

შექმენი <select> თეგი, სადაც მომხმარებელს შეეძლება კვირის დღის არჩევა.

დაამატე შემდეგი option-ები:

- Monday
- Tuesday
- Wednesday
- Thursday
- Friday
- Saturday
- Sunday

ჩამოსაშლელ მენიუში პირველ ვარიანტად დაამატე:

Choose a day

ეს ვარიანტი უნდა იყოს disabled. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="Register">
        <label for="text">Enter youre week day: </label>
        <select name="" id="Week day">Week day
            <option disabled value ="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>

        </select>
        <button>Submit</button>
    </form>
</body>
</html>
