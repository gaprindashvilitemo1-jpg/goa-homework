<!--9. შექმენი ქულების შესაყვანი Input

შექმენი HTML ფაილი და დაამატე <input>, სადაც მომხმარებელი შეიყვანს გამოცდის ქულას.

დავალება:

- გამოიყენე type="number".
- მიუთითე min="0".
- მიუთითე max="100".
- გამოიყენე required.
- დაამატე label ტექსტით: Enter your score. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="Register">
    <label for="number">Enter youre score: </label>
    <input type="number", min="0", max="100", required>
    <button>Submit</button>
    </form>
</body>
</html>
