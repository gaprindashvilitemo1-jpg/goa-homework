<!-- 4. აირჩიე საყვარელი ფერი

შექმენი HTML ფაილი და დაამატე <select> თეგი.

ჩამოსაშლელ მენიუში დაამატე:

- Red
- Blue
- Green
- Yellow
- Black
- White

პირველ ვარიანტად დაამატე:

Choose your favorite color

ეს ვარიანტი უნდა იყოს disabled.--> 

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="Register">
        <label for="text">Enter youre fav collor: </label>
        <select name="" id="Collor">Youre collor
            <option disabled value="Choose your favorite color">Choose your favorite color</option>
            <option value="Red">Red</option>
            <option value="Blue">Blue</option>
            <option value="Green">Green</option>
            <option value="Yellow">Yellow</option>
            <option value="Black">Black</option>
            <option value="White">White</option>

        </select>
        <button>Submit</button>
    </form>
</body>
</html>
