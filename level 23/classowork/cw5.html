<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action=""></form>
    <h1>Travel reservation form</h1>
    <br>
    <h2>*denotes mandotory</h2>
    <br>
    <label for="name">Full name*:</label>
    <br>
    <input type="text" placeholder="FirstName">
    <br>
    <label for="email">Email address*:</label>
    <br>
    <input type="email" placeholder="EMAIL_ADDRESS">
    <h3>Select Tour Package* :</h3>
    <select name="" id="Goa">
        <option value="Goa">Goa</option>
    </select>
    <label for="date">Arrival date*:</label>
    <br>
    <input type="date" placeholder="m/d/y">
    <br>
    <label for="number">Number of persons*: </label>
    <br>
    <input type="number" placeholder="UNKNOWN_TYPE">
    <br>
    <label for="checkbox">what would you want to avail</label>
    <h3>What would you want to avail</h3>
    <label for="">Boarding</label>
    <input type="checkbox">
    <br>
    <label for="">Fooding</label>
    <input type="checkbox">
    <br>
    <label for="">Sight seeing</label>
    <input type="checkbox">
    <br>
    <label for="">Discount Coupon code: </label>
    <br>
    <input type="text" placeholder="UNKNOWN_TYPE">
    <h3>Terms and conditions*</h3>
    <label for="">I agree</label>
    <input type="radio">
    <label >I disagree</label>
    <input type="radio">
    <br>
    <button>Complete reservation</button>


    </form>
</body>
</html>
