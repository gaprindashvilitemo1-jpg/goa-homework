<!--1. შექმენი პროფილის პარამეტრები (Preferences)

შექმენი HTML ფაილი და დაამატე <form>.

დაამატე <fieldset> თეგი, სადაც <legend>-ში ეწერება: Profile Preferences.

ჯგუფის შიგნით დაამატე:

- <input> ფერის ასარჩევად type="color" ატრიბუტით. საწყის ფერად (value) მიუთითე #3498db.
- <input> შეტყობინებების ხმის დასარეგულირებლად type="range" ატრიბუტით. მიუთითე min="0", max="100" და step="5".
- <input> ქალაქის ჩასაწერად, რომელსაც დაუკავშირებ <datalist> თეგს.
- <datalist>-ში დაამატე 3 option: Tbilisi, Kutaisi, Batumi.
- input-ში დაამატე placeholder="Type or select city...".

2. შექმენი ანგარიშის მონაცემები (Account Details)

შექმენი მეორე <fieldset> თეგი, სადაც <legend>-ში ეწერება: Account Details.

ჯგუფის შიგნით დაამატე:

- <input> მომხმარებლის როლისთვის. value ატრიბუტში ჩაუწერე Student და გახადე readonly.
- <input> პრომო კოდისთვის. value ატრიბუტში ჩაუწერე NOT_ACTIVE და გახადე disabled.
- <input> Username-ის შესაყვანად. ველი უნდა იყოს აუცილებლად შესავსები (required). მინიმალური სიგრძე minlength="3", მაქსიმალური სიგრძე maxlength="15".
- <input> უსაფრთხოების კოდისთვის (Security PIN). გამოიყენე pattern="[0-9]{4}", დაამატე title="Enter 4-digit PIN" და გახადე required.

3. ფორმის გაგზავნა

ფორმაში ბოლოში დაამატე button ტექსტით: Save Settings. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Preferences</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Profile Preferences</legend>
            <label>Choose color:</label>
            <input type="color" value="#3498db">

            <br><br>

            <label>Notification sound:</label>
            <input type="range" min="0" max="100" step="5">

            <br><br>

            <label>City:</label>
            <input type="text" list="cities" placeholder="Type or select city...">
            <datalist id="cities">
                <option value="Tbilisi">
                <option value="Kutaisi">
                <option value="Batumi">
            </datalist>
        </fieldset>

        <br><br>

        
        <fieldset>
            <legend>Account Details</legend>
            <label>User Role:</label>
            <input type="text" value="Student" readonly>

            <br><br>

            <label for="promo">Promo Code:</label>
            <input type="text" id="promo" value="NOT_ACTIVE" disabled>

            <br><br>

            <label for="username">Username:</label>
            <input type="text" minlength="3" maxlength="15" required>

            <br><br>

            <label for="pin">Security PIN:</label>
            <input type="text" id="pin" pattern="[0-9]{4}" title="Enter 4-digit PIN" required>
        </fieldset>

        <br>
        <button type="submit">Save Settings</button>

    </form>
</body>
</html>
